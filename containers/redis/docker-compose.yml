services:
  redis:
    image: redis/redis-stack:7.4.0-v8
    container_name: redis
    ports:
      - "6379:6379"
      - "8001:8001"
    # command: ["redis-server"] --> for run container with custom params
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - redis_data:/data
    networks:
      - compose-net
    restart: unless-stopped

volumes:
  redis_data:

networks:
  compose-net:
    driver: external