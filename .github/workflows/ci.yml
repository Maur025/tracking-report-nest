name: CI tracking-reports

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  review-build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2.0.0
        with:
          runtime: node@${{ matrix.node-version }}
          cache: true

      - name: Code check
        run: pnpm lint

      - name: Run unit tests
        run: pnpm test

      - name: Build project
        run: pnpm build
